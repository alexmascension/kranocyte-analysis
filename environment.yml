# Entorno de analisis de kranocito.
#
# IMPORTANTE: este fichero describe el entorno; NO lo fija. El fichero autoritativo es
# el lock que genera `capture_env.sh` en la maquina donde se produjeron los resultados.
# Generar este environment.yml NO sustituye a capturar el entorno real.
#
# Python 3.11 no es una eleccion libre: es la version que declaran los notebooks
# (metadata.language_info.version = 3.11.0). Las versiones de abajo son las ultimas
# de cada paquete que admiten 3.11; varias de ellas ya NO son las ultimas publicadas.
# Sin estos topes, una reinstalacion desde cero resuelve a versiones distintas de las
# que produjeron los resultados -- en liana y cellrank, a una version MAYOR distinta.
#
# La ubicacion conda-forge/bioconda de cada paquete no se ha podido verificar en linea;
# confirmala al generar el lock.

name: kranocito
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11

  # --- nucleo cientifico ---
  - numpy<=2.4.6
  - scipy<=1.17.1
  - pandas<=3.1.1
  - scikit-learn<=1.9.1
  - statsmodels<=0.15.0
  - networkx<=3.6.1
  - threadpoolctl<=3.8.0

  # --- graficos ---
  - matplotlib<=3.11.2
  - seaborn<=0.13.2
  - plotly<=7.1.0

  # --- single cell ---
  - anndata<=0.12.19
  - scanpy<=1.11.5
  - scvelo<=0.3.4
  - cellrank<=2.0.7        # 2.x: la 2.4 ya no admite 3.11
  - harmonypy<=2.1.0
  - phate<=2.0.0
  - gseapy<=1.3.2
  - leidenalg
  - python-igraph

  # --- puente con R (scran via rpy2, backend alternativo de size factors) ---
  - rpy2<=3.6.9
  - anndata2ri<=2.0.1
  - bioconductor-scran

  - pip
  - pip:
      # --- analisis especializado ---
      - triku<=2.2.0
      - cellassign<=2.1.0
      - doubletdetection<=4.3.0.post1
      - scib-metrics<=0.5.10
      - scFates<=1.2.8
      - palantir<=1.4.6
      - liana<=1.10.0          # 1.x: la 2.x ya no admite 3.11 y cambia la API
      - cellphonedb<=5.0.1
      - cellbender<=0.4.0

      # --- utilidades ---
      - pybiomart<=0.2.0
      - adjustText<=1.4.0
      - UpSetPlot<=0.9.0
      - fa2<=1.1.2
      - scranpy<=0.3.1      # BiocPy/libscran: centrado por library size

      # scranPY (sfortma2) NO esta en PyPI y es OTRO paquete distinto de scranpy:
      # implementa computeSumFactors de Lun et al. Fijar por commit, no por rama.
      - git+https://github.com/sfortma2/scranPY.git@<COMMIT_SHA>

      # el propio proyecto, en modo editable
      - -e .
