# Analysis environment for kranocyte.
#
# IMPORTANT: this file DESCRIBES the environment; it does not PIN it. The authoritative
# file is the lock produced by `capture_env.sh` on the machine where the results were
# generated. Writing this environment.yml is NOT a substitute for capturing the real one.
#
# Python 3.11 is not a free choice: it is the version the notebooks declare
# (metadata.language_info.version = 3.11.0). The versions below are the last release of
# each package that still supports 3.11; several of them are no longer the latest
# published. Without these ceilings, a clean reinstall resolves to versions other than
# the ones that produced the results -- for liana and cellrank, to a different MAJOR.
#
# The conda-forge/bioconda location of each package could not be verified online;
# confirm it when generating the lock.

name: kranocyte
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11

  # --- scientific core ---
  - numpy<=2.4.6
  - scipy<=1.17.1
  - pandas<=3.1.1
  - scikit-learn<=1.9.1
  - statsmodels<=0.15.0
  - networkx<=3.6.1
  - threadpoolctl<=3.8.0

  # --- plotting ---
  - matplotlib<=3.11.2
  - seaborn<=0.13.2
  - plotly<=7.1.0

  # --- single cell ---
  - anndata<=0.12.19
  - scanpy<=1.11.5
  - scvelo<=0.3.4
  - cellrank<=2.0.7        # 2.x: 2.4 no longer supports 3.11
  - harmonypy<=2.1.0
  - phate<=2.0.0
  - gseapy<=1.3.2
  - leidenalg
  - python-igraph

  # --- bridge to R (scran via rpy2, alternative size-factor backend) ---
  - rpy2<=3.6.9
  - anndata2ri<=2.0.1
  - bioconductor-scran

  - pip
  - pip:
      # --- specialised analysis ---
      - triku<=2.2.0
      - cellassign<=2.1.0
      - doubletdetection<=4.3.0.post1
      - scib-metrics<=0.5.10
      - scFates<=1.2.8
      - palantir<=1.4.6
      - liana<=1.10.0          # 1.x: 2.x no longer supports 3.11 and changes the API
      - cellphonedb<=5.0.1
      - cellbender<=0.4.0

      # --- utilities ---
      - pybiomart<=0.2.0
      - adjustText<=1.4.0
      - UpSetPlot<=0.9.0
      - fa2<=1.1.2
      - scranpy<=0.3.1      # BiocPy/libscran: library-size centring

      # scranPY (sfortma2) is NOT on PyPI and is a DIFFERENT package from scranpy:
      # it implements computeSumFactors of Lun et al. Pin it by commit, not by branch.
      - git+https://github.com/sfortma2/scranPY.git@<COMMIT_SHA>

      # the project itself, in editable mode
      - -e .