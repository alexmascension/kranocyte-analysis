[build-system
]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project
]
name = "kranocyte"
version = "2.0.0"
description = "Characterisation of kranocyte and FAP populations in mouse skeletal muscle"
requires-python = ">=3.11,<3.12"
readme = "README.md"

# Dependencies are declared in environment.yml and pinned in the lock file.
# Only what the package strictly needs in order to import is listed here.
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "anndata",
    "scanpy",
    "matplotlib",
]

[tool.setuptools.packages.find
]
where = ["src"]
include = ["kranocyte*"]

[tool.setuptools.package-data
]
kranocyte = ["py.typed"]